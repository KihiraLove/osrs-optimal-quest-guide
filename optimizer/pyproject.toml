[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-quest-optimizer"
version = "0.1.0"
description = "Offline data validation scaffold for an OSRS quest-order optimizer"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.scripts]
quest-optimizer = "quest_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
