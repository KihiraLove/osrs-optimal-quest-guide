name: Validate optimizer scaffold

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optimizer
        run: python -m pip install -e ./optimizer
      - name: Validate committed JSON
        run: |
          quest-optimizer validate-data data/manifest.json
          if ! quest-optimizer audit-data data/manifest.json > "$RUNNER_TEMP/coverage-audit.json"; then
            cat "$RUNNER_TEMP/coverage-audit.json"
            exit 1
          fi
          quest-optimizer validate-json profile examples/build-242/cooks-assistant-profile.json --catalog data/manifest.json
          quest-optimizer validate-json profile data/profiles/main-baseline.json
          quest-optimizer validate-json solution examples/build-242/museum-quiz-solution.json --catalog data/manifest.json --profile examples/build-242/museum-quiz-profile.json
          quest-optimizer validate-json solution examples/build-242/balloon-travel-solution.json --catalog data/manifest.json --profile examples/build-242/balloon-travel-profile.json
          quest-optimizer validate-data examples/synthetic/manifest.json
          quest-optimizer validate-json profile examples/synthetic/profile.json
          quest-optimizer validate-json solution examples/synthetic/solution.json
          quest-optimizer validate-json profile examples/synthetic/profile.json --catalog examples/synthetic/manifest.json
          quest-optimizer validate-json solution examples/synthetic/solution.json --catalog examples/synthetic/manifest.json --profile examples/synthetic/profile.json
      - name: Solve and replay offline routes
        run: |
          quest-optimizer replay examples/build-242/museum-quiz-solution.json --catalog data/manifest.json --profile examples/build-242/museum-quiz-profile.json
          quest-optimizer replay examples/build-242/balloon-travel-solution.json --catalog data/manifest.json --profile examples/build-242/balloon-travel-profile.json
          quest-optimizer replay examples/synthetic/solution.json --catalog examples/synthetic/manifest.json --profile examples/synthetic/profile.json
          quest-optimizer solve-small data/manifest.json examples/build-242/cooks-assistant-profile.json > "$RUNNER_TEMP/exact-cook.json"
          quest-optimizer replay "$RUNNER_TEMP/exact-cook.json" --catalog data/manifest.json --profile examples/build-242/cooks-assistant-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/museum-quiz-profile.json --incumbent "$RUNNER_TEMP/bounded-museum.json" --report "$RUNNER_TEMP/bounded-report.json" > /dev/null
          quest-optimizer replay "$RUNNER_TEMP/bounded-museum.json" --catalog data/manifest.json --profile examples/build-242/museum-quiz-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/restless-ghost-profile.json > "$RUNNER_TEMP/restless-ghost.json"
          quest-optimizer replay "$RUNNER_TEMP/restless-ghost.json" --catalog data/manifest.json --profile examples/build-242/restless-ghost-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/lumbridge-arrival-profile.json --beam-width 192 > "$RUNNER_TEMP/lumbridge-arrival.json"
          quest-optimizer replay "$RUNNER_TEMP/lumbridge-arrival.json" --catalog data/manifest.json --profile examples/build-242/lumbridge-arrival-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/fairy-ring-access-profile.json > "$RUNNER_TEMP/fairy-ring-access.json"
          quest-optimizer replay "$RUNNER_TEMP/fairy-ring-access.json" --catalog data/manifest.json --profile examples/build-242/fairy-ring-access-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/lost-city-preparation-profile.json > "$RUNNER_TEMP/lost-city-preparation.json"
          quest-optimizer replay "$RUNNER_TEMP/lost-city-preparation.json" --catalog data/manifest.json --profile examples/build-242/lost-city-preparation-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/lost-city-completion-profile.json > "$RUNNER_TEMP/lost-city-completion.json"
          quest-optimizer replay "$RUNNER_TEMP/lost-city-completion.json" --catalog data/manifest.json --profile examples/build-242/lost-city-completion-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/stronghold-security-profile.json --beam-width 96 > "$RUNNER_TEMP/stronghold-security.json"
          quest-optimizer replay "$RUNNER_TEMP/stronghold-security.json" --catalog data/manifest.json --profile examples/build-242/stronghold-security-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/lost-city-combat-profile.json --beam-width 256 > "$RUNNER_TEMP/lost-city-combat.json"
          quest-optimizer replay "$RUNNER_TEMP/lost-city-combat.json" --catalog data/manifest.json --profile examples/build-242/lost-city-combat-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/rfd-opening-goblins-profile.json --beam-width 96 > "$RUNNER_TEMP/rfd-opening-goblins.json"
          quest-optimizer replay "$RUNNER_TEMP/rfd-opening-goblins.json" --catalog data/manifest.json --profile examples/build-242/rfd-opening-goblins-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/rfd-mountain-dwarf-profile.json --beam-width 128 --max-expansions 40000 > "$RUNNER_TEMP/rfd-mountain-dwarf.json"
          quest-optimizer replay "$RUNNER_TEMP/rfd-mountain-dwarf.json" --catalog data/manifest.json --profile examples/build-242/rfd-mountain-dwarf-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/rfd-pirate-pete-profile.json --beam-width 128 --max-expansions 40000 > "$RUNNER_TEMP/rfd-pirate-pete.json"
          quest-optimizer replay "$RUNNER_TEMP/rfd-pirate-pete.json" --catalog data/manifest.json --profile examples/build-242/rfd-pirate-pete-profile.json
          quest-optimizer solve-bounded data/manifest.json examples/build-242/big-chompy-bird-hunting-profile.json --beam-width 128 --max-expansions 40000 > "$RUNNER_TEMP/big-chompy-bird-hunting.json"
          quest-optimizer replay "$RUNNER_TEMP/big-chompy-bird-hunting.json" --catalog data/manifest.json --profile examples/build-242/big-chompy-bird-hunting-profile.json
          quest-optimizer replay examples/build-242/rfd-skrach-uglogwee-solution.json --catalog data/manifest.json --profile examples/build-242/rfd-skrach-uglogwee-profile.json
      - name: Run optimizer checks
        run: python -m unittest discover -s optimizer/tests -v
